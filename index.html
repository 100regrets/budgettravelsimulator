<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetTravel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌍 BudgetTravel</h1>
        <p>Trouve ton voyage idéal selon ton budget</p>
    </header>

    <main>

        <section class="search-box">

            <h2>✈️ Trouve ton voyage</h2>

            <label for="continent">🌎 Continent</label>
            <select id="continent">
                <option value="all">Tous les continents</option>
                <option value="Europe">Europe</option>
                <option value="Asia">Asie</option>
                <option value="Africa">Afrique</option>
                <option value="America">Amérique</option>
                <option value="Oceania">Océanie</option>
            </select>

            <label for="country">🌍 Pays</label>
            <select id="country">
                <option value="all">Tous les pays</option>
            </select>

            <label for="budget">💰 Budget total (€)</label>
            <input type="number" id="budget" placeholder="Ex : 1500" min="1">

            <label for="travelers">👥 Nombre de voyageurs</label>
            <input type="number" id="travelers" value="2" min="1">

            <div class="dates">
                <div>
                    <label for="start">📅 Départ</label>
                    <input type="date" id="start">
                </div>

                <div>
                    <label for="end">📅 Retour</label>
                    <input type="date" id="end">
                </div>
            </div>

            <label for="style">🏝️ Type de voyage</label>
            <select id="style">
                <option value="all">Tous les types</option>
                <option value="sun">☀️ Plage & soleil</option>
                <option value="city">🏙️ Ville</option>
                <option value="nature">🏔️ Nature</option>
                <option value="culture">🏛️ Culture</option>
                <option value="food">🍝 Gastronomie</option>
            </select>

            <button id="searchButton">
                🔎 Trouver mon voyage
            </button>

        </section>

        <section class="results-section">

            <h2>🌍 Destinations recommandées</h2>

            <p id="resultsInfo">
                Choisis tes critères pour découvrir des destinations.
            </p>

            <div id="results"></div>

        </section>

    </main>

    <footer>
        <p>🌍 BudgetTravel — Trouve ton voyage selon ton budget</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
